# D:\42_asia-hackathon\docker-compose.yml (최종 하이브리드 GPU 전략)

services:
  app:
    build: .
    ports:
      - "8001:8000"
    # 👇 [유령 캐시 해결] ./app 마운트는 주석 처리된 상태로 유지합니다.
    # volumes:
    #   - ./app:/usr/src/app
    volumes:
      - ./models:/usr/src/models
      # 🔴 [수정] 파일 업로드를 위한 공유 볼륨
      - uploads_data:/tmp/doc_uploads
    env_file:
      - .env
    environment:
      - MODEL_PATH=/usr/src/models/classifier
    depends_on:
      - redis
      - qdrant
      - meilisearch
      - llm-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: on-failure

  celery-worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=info
    # 👇 [유령 캐시 해결] ./app 마운트는 주석 처리된 상태로 유지합니다.
    # volumes:
    #   - ./app:/usr/src/app
    volumes:
      - ./models:/usr/src/models
      # 🔴 [수정] app과 동일한 공유 볼륨 (파일 읽기용)
      - uploads_data:/tmp/doc_uploads
    env_file:
      - .env
    environment:
      - MODEL_PATH=/usr/src/models/classifier
    depends_on:
      - redis
      - qdrant
      - meilisearch
      - llm-server
    restart: on-failure
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  meilisearch:
    image: getmeili/meilisearch:latest
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=SuperSecure_42Asia_MasterKey
    volumes:
      - meili_data:/meili_data
    restart: always

  llm-server:
    build:
      context: ./shimmy-source
      dockerfile: Dockerfile
    
    # 🔴 [CPU 유지] llm-server는 VRAM이 부족하므로 CPU로 실행합니다.
    # 'deploy' 섹션을 추가하지 않습니다.
    command:
      - "shimmy"
      - "serve"
      - "--bind"
      - "0.0.0.0:11435"
      # [필수] --model-path로 Gemma 모델(.gguf)을 직접 지정합니다.
      - "--model-path"
      - "/models/google_gemma-3-4b-it-Q4_K_M.gguf"

    ports:
      - "11435:11435"
    volumes:
      # 🔴 [필수] 로컬 모델 마운트
      - ./models:/models
    restart: always

volumes:
  redis_data:
  qdrant_data:
  meili_data:
  # 🔴 [수정] 공유 볼륨 정의
  uploads_data: