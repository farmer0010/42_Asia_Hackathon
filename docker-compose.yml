# [수정 후: docker-compose.yml]
# (원본 'ver2'의 Full GPU 전략 파일 기준)

services:
  app:
    build: .
    ports:
      - "8001:8000"
    volumes:
      - ./models:/usr/src/models
      # 🔴 [수정] main.py의 새 경로(/uploads_data/input)와 맞춤
      # (기존: - uploads_data:/tmp/doc_uploads)
      - uploads_data:/uploads_data
    env_file:
      - .env
    environment:
      - MODEL_PATH=/usr/src/models/classifier
    depends_on:
      - redis
      - qdrant
      - meilisearch
      - llm-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: on-failure

  celery-worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=info
    volumes:
      - ./models:/usr/src/models
      # 🔴 [수정] main.py의 새 경로(/uploads_data/input)와 맞춤
      # (기존: - uploads_data:/tmp/doc_uploads)
      - uploads_data:/uploads_data
    env_file:
      - .env
    environment:
      - MODEL_PATH=/usr/src/models/classifier
    depends_on:
      - redis
      - qdrant
      - meilisearch
      - llm-server
    restart: on-failure
    # 🔴 [Full GPU 전략 1] Celery-worker에 GPU 할당 (유지)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  meilisearch:
    image: getmeili/meilisearch:latest
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=SuperSecure_42Asia_MasterKey
    volumes:
      - meili_data:/meili_data
    restart: always

  llm-server:
    build:
      context: ./shimmy-source
      dockerfile: Dockerfile
    command:
      - "shimmy"
      - "serve"
      - "--bind"
      - "0.0.0.0:11435"
      - "--model-path"
      - "/models/Qwen2.5-7b-Chat-Q4_K_M.gguf"
    ports:
      - "11435:11435"
    volumes:
      - ./models:/models
    restart: always
    # 🔴 [Full GPU 전략 2] llm-server에 GPU 할당 (누락된 부분)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [ gpu ]

volumes:
  redis_data:
  qdrant_data:
  meili_data:
  # 🔴 [수정] 공유 볼륨 정의 (이름은 'uploads_data'로 동일)
  uploads_data: