# docker-compose.yml

services:
  app:
    build: .
    ports:
      - "8001:8000"
    # 👇 [수정] bind mount를 삭제합니다. (유령 캐시 문제 해결)
    # volumes:
    #   - ./app:/usr/src/app
    volumes: # (models 볼륨은 유지)
      - ./models:/usr/src/models
    env_file:
      - .env
    environment:
      - MODEL_PATH=/usr/src/models/classifier
    depends_on:
      - redis
      - qdrant
      - meilisearch
      - llm-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: on-failure

  celery-worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=info
    # 👇 [수정] bind mount를 삭제합니다. (가장 중요!)
    # volumes:
    #   - ./app:/usr/src/app
    volumes: # (models 볼륨은 유지)
      - ./models:/usr/src/models
    env_file:
      - .env
    environment:
      - MODEL_PATH=/usr/src/models/classifier
    depends_on:
      - redis
      - qdrant
      - meilisearch
      - llm-server
    restart: on-failure

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  meilisearch:
    image: getmeili/meilisearch:latest
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=SuperSecure_42Asia_MasterKey
    volumes:
      - meili_data:/meili_data
    restart: always

  llm-server:
    build:
      context: ./shimmy-source
      dockerfile: Dockerfile

    # [수정] command: 리스트의 맨 앞에 실행 파일 'shimmy'를 추가해야 합니다.
    command: [
      # 0. 실행 파일
      "shimmy",

      # 1. Global Arg: 모델 디렉토리 지정
      "--model-dirs",
      "/usr/src/models",

      # 2. Subcommand: 서버 실행
      "serve",

      # 3. Subcommand Arg: 0.0.0.0:11434로 바인딩
      "--bind",
      "0.0.0.0:11434"
    ]

    volumes:
      # 🔴 핵심 제약 조건: 이 로컬 모델 마운트는 절대적으로 유지되어야 함.
      - ./models:/usr/src/models

    ports:
      - "11434:11434"

    depends_on:
      - redis

volumes:
  redis_data:
  qdrant_data:
  meili_data: