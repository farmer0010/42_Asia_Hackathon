# docker-compose.yml

services:
  app:
    build: .
    ports:
      - "8001:8000"
    # 👇 [수정] bind mount를 삭제합니다. (유령 캐시 문제 해결)
    # volumes:
    #   - ./app:/usr/src/app
    volumes: # (models 볼륨은 유지)
      - ./models:/usr/src/models
    env_file:
      - .env
    environment:
      - MODEL_PATH=/usr/src/models/classifier
    depends_on:
      - redis
      - qdrant
      - meilisearch
      - llm-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: on-failure

  celery-worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=info
    # 👇 [수정] bind mount를 삭제합니다. (가장 중요!)
    # volumes:
    #   - ./app:/usr/src/app
    volumes: # (models 볼륨은 유지)
      - ./models:/usr/src/models
    env_file:
      - .env
    environment:
      - MODEL_PATH=/usr/src/models/classifier
    depends_on:
      - redis
      - qdrant
      - meilisearch
      - llm-server
    restart: on-failure

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  meilisearch:
    image: getmeili/meilisearch:latest
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=SuperSecure_42Asia_MasterKey
    volumes:
      - meili_data:/meili_data
    restart: always

  llm-server:
    build:
      context: ./shimmy-source
    ports:
      - "11435:11435" # 1. 포트는 11435로 통일
    volumes:
      - ./models:/models
    environment:
      - SHIMMY_MODEL_DIR=/models

      # 👇 [가장 중요] "SHIMMY_WEB_HOST" -> "SHIMMY_HOST"로 변경 (Shimmy 소스코드 기준)
      - SHIMMY_HOST=0.0.0.0

      # 👇 [가장 중요] "SHIMMY_WEB_PORT" -> "SHIMMY_PORT"로 변경 (Shimmy 소스코드 기준)
      - SHIMMY_PORT=11435

    restart: always

volumes:
  redis_data:
  qdrant_data:
  meili_data: